version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: bitmax-mongodb
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bitmax-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/ticketing_system
      - CLIENT_URL=http://localhost:5173
      - JWT_ACCESS_SECRET=production_super_secret_jwt_access_token_key_2026
      - JWT_REFRESH_SECRET=production_super_secret_jwt_refresh_token_key_2026
      - JWT_ACCESS_EXPIRES=15m
      - JWT_REFRESH_EXPIRES=7d
      - OTP_EXPIRES_MINUTES=5
      - OTP_MAX_ATTEMPTS=5
    ports:
      - '5000:5000'
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bitmax-frontend
    restart: always
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  mongo_data:
