services:
  - type: web
    name: mern-ticketing-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: SERVE_FRONTEND
        value: "false"
      - key: CLIENT_URL
        value: https://mern-ticketing-system-1.onrender.com
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GMAIL_IMAP_ENABLED
        value: "false"
      - key: GOOGLE_APPS_SCRIPT_URL
        sync: false
      - key: EMAIL_API_SECRET
        sync: false
  - type: static
    name: mern-ticketing-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://mern-ticketing-system-qqpf.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
